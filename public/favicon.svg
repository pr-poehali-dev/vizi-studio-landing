<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="40%" stop-color="#f3f4f6"/>
      <stop offset="70%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="metalBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <filter id="glowCyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMagenta" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#00000050"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="10" fill="#f4f4f5"/>

  <!-- V shape body -->
  <path d="M10 8 L24 36 L38 8" stroke="url(#metal)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)"/>

  <!-- V inner engraving -->
  <path d="M14 8 L24 30 L34 8" stroke="#4b5563" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.45"/>

  <!-- Left cyan neon -->
  <path d="M10 8 L6 3" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glowCyan)"/>
  <path d="M10 8 L6 3" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Right magenta neon -->
  <path d="M38 8 L42 3" stroke="#f000ff" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glowMagenta)"/>
  <path d="M38 8 L42 3" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Bottom bar -->
  <rect x="7" y="39" width="34" height="6" rx="2" fill="url(#metalBar)" filter="url(#shadow)"/>
</svg>